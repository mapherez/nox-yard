name: nox-yard

services:
  nox-yard:
    image: ghcr.io/mapherez/nox-yard:latest
    container_name: nox-yard
    restart: unless-stopped
    init: true
    ports:
      - "${NOX_BIND_ADDRESS:-0.0.0.0}:${NOX_PORT:-8095}:8080"
    environment:
      TZ: ${NOX_TIMEZONE:-Etc/UTC}
      NOX_DATA_DIR: /data
      NOX_WEB_DIR: /srv/nox-yard/web
      NOX_LISTEN_ADDR: :8080
      NOX_PUBLIC_URL: ${NOX_PUBLIC_URL:-}
      NOX_YARD_API_ENABLED: ${NOX_YARD_API_ENABLED:-false}
      NOX_YARD_API_KEY: ${NOX_YARD_API_KEY:-}
      NOX_YARD_VERSION: ${NOX_YARD_VERSION:-}
      NOX_HOST_HOME: ${HOME:-}
      NOX_HOST_USERPROFILE: ${USERPROFILE:-}
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
