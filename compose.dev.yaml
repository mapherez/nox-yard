name: nox-yard-dev

services:
  api:
    build:
      context: .
      target: dev-backend
    image: nox-yard:dev-backend
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NOX_DATA_DIR: /data
      NOX_LISTEN_ADDR: :8080
      NOX_PUBLIC_URL: http://127.0.0.1:5173
    volumes:
      - dev-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  dev-data:
