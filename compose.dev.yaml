name: nox-yard-dev

services:
  api:
    build:
      context: .
      target: dev-backend
    image: nox-yard:dev-backend
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: ${NOX_TIMEZONE:-Etc/UTC}
      NOX_DATA_DIR: /data
      NOX_LISTEN_ADDR: :8080
      NOX_PUBLIC_URL: http://127.0.0.1:5173
      NOX_YARD_API_ENABLED: ${NOX_YARD_API_ENABLED:-false}
      NOX_YARD_API_KEY: ${NOX_YARD_API_KEY:-}
      NOX_YARD_VERSION: ${NOX_YARD_VERSION:-}
      NOX_HOST_HOME: ${HOME:-}
      NOX_HOST_USERPROFILE: ${USERPROFILE:-}
    volumes:
      - dev-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      NOX_API_PROXY_TARGET: http://api:8080
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  dev-data:
  web-node-modules:
