name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Install Chrome for frontend regressions
        run: npx --yes --package @playwright/cli@0.1.22 playwright-cli install-browser chrome
      - name: Run shared source checks
        run: sh scripts/ci-local.sh

  docker:
    name: Docker builds and ARM64 smoke test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve application build version
        id: metadata
        run: |
          version=$(sh scripts/build-version.sh "$GITHUB_SHA")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: nox-yard:ci-amd64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
      - name: Build linux/arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: nox-yard:ci-arm64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
      - name: Check ARM64 executable and runtime health
        run: sh scripts/smoke-arm64.sh nox-yard:ci-arm64
