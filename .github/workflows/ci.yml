name: CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  validate:
    name: Source validation
    runs-on: ubuntu-latest
    concurrency:
      group: ci-source-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: true
    outputs:
      release_tag: ${{ steps.request.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Identify script release request
        id: request
        run: node scripts/release-request.mjs
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Install Chrome for frontend regressions
        run: npx --yes --package @playwright/cli@0.1.22 playwright-cli install-browser chrome
      - name: Run shared source checks
        run: sh scripts/ci-local.sh

  docker:
    name: Docker builds and ARM64 smoke test
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: ci-docker-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve application build version
        id: metadata
        env:
          REQUESTED_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          version="$REQUESTED_TAG"
          if [ -z "$version" ]; then
            version=$(sh scripts/build-version.sh "$GITHUB_SHA")
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: nox-yard:ci-amd64
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
      - name: Build linux/arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: nox-yard:ci-arm64
          cache-from: type=gha,scope=ci-arm64
          cache-to: type=gha,mode=max,scope=ci-arm64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
      - name: Check ARM64 executable and runtime health
        run: sh scripts/smoke-arm64.sh nox-yard:ci-arm64

  release:
    name: Release after successful CI
    needs: [validate, docker]
    if: needs.validate.outputs.release_tag != ''
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.validate.outputs.release_tag }}
