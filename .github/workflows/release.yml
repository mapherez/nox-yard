name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    # Serialize official publication so two stable tags cannot race to replace latest.
    concurrency:
      group: nox-yard-official-publisher
      cancel-in-progress: false
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate tag against VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"
      - name: Generate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Refuse existing releases or an older stable version
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { assertLatestStable } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release-version.mjs`).href);
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            if (releases.some(release => release.tag_name === process.env.RELEASE_TAG)) {
              throw new Error(`GitHub Release ${process.env.RELEASE_TAG} already exists; refusing to replace it.`);
            }
            assertLatestStable(process.env.RELEASE_TAG, releases.filter(release => !release.draft && !release.prerelease).map(release => release.tag_name));
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Validate tagged source
        run: sh scripts/ci-local.sh
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_VERSION=${{ github.ref_name }}
      - name: Create GitHub Release with generated notes
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        with:
          script: |
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.RELEASE_TAG,
              name: process.env.RELEASE_TAG,
              generate_release_notes: true,
              draft: false,
              prerelease: process.env.RELEASE_PRERELEASE === 'true',
              make_latest: process.env.RELEASE_PRERELEASE === 'true' ? 'false' : 'true',
            });
